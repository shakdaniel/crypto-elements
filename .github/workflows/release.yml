name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release PR and tags
      pull-requests: write
      id-token: write      # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check


      # Opens/updates a "Version Packages" PR while changesets are pending.
      # Merging that PR runs this job again, and `publish` pushes to npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # NODE_AUTH_TOKEN is what setup-node writes into .npmrc; NPM_TOKEN is what
          # changesets/action looks for. Without the latter it silently falls back to
          # OIDC trusted publishing, which no new package has configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # publishConfig.access and .changeset/config.json both say "public", yet the
          # first release went out restricted. Set it where npm itself reads it.
          NPM_CONFIG_ACCESS: public

      # changesets reports success from its own bookkeeping, not from what npm serves.
      # Check each package it claims to have published, without credentials.
      #
      # npm commits a publish asynchronously: in the 0.1.1 release core appeared ~70s
      # and react ~2min after changesets reported success. Allow 10 minutes before
      # calling it a failure; a restricted publish never appears, so it still fails.
      - name: Verify published packages are public
        if: steps.changesets.outputs.published == 'true'
        timeout-minutes: 12
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          while read -r name version; do
            url="https://registry.npmjs.org/${name/\//%2F}/$version"
            for attempt in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$url?t=$(date +%s)")
              [ "$code" = 200 ] && break
              sleep 15
            done
            if [ "$code" != 200 ]; then
              echo "::error::$name@$version is not publicly available (HTTP $code). It may have been published restricted — check 'npm access get status $name'."
              exit 1
            fi
            echo "✔ $name@$version is public"
          done < <(echo "$PUBLISHED" | jq -r '.[] | "\(.name) \(.version)"')
